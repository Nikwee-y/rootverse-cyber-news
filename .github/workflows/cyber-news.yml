name: RootVerse Cyber News

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Kolkata"

    - cron: "0 19 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cyber News Bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python news_bot.py

      - name: Save article history
        run: |
          git config user.name "RootVerse Cyber News"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_articles.json

          if git diff --cached --quiet; then
            echo "No article history changes."
          else
            git commit -m "Update cyber news history"
            git push
          fi
